name: Doclix Autofill APK
on:
  push:
    branches: ["doclix-autofill-production"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: DoclixAutofill
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: doclix-autofill-debug
          path: DoclixAutofill/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
